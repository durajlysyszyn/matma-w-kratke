<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Matma w kratkę</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: spokojny, życzliwy korepetytor – rzeczowo, bez infantylności i bez presji.
   IDEA: zeszyt w kratkę – każda umiejętność to kratka, którą uczeń stopniowo „zamalowuje".
   PICTURE: mapa kratek na stronie głównej: wszystkie umiejętności, kolor = poziom opanowania 0–5.
   COLOUR and TYPE: papier + kratka, niebieski długopis (główny), żółty zakreślacz (wsparcie), koral (seria, odznaki); Lexend – krój projektowany z myślą o łatwości czytania.
   LAYOUT: górny pasek z czterema miejscami; treść do 1100px; lekcja w jednej spokojnej kolumnie; poniżej 600px wszystko w jednej kolumnie. */
:root{color-scheme:light dark;
--bg:light-dark(#fbfbf8,#12151c);--grid:light-dark(#e3e8f3,#1e2431);--card:light-dark(#ffffff,#191d27);--ink:light-dark(#1c2130,#e9ecf4);--mute:light-dark(#5d6478,#9aa2b8);--line:light-dark(#d9dde8,#2b3242);
--pen:light-dark(#2f4bd8,#7f95ff);--pen-ink:light-dark(#ffffff,#0e1220);--pen-soft:light-dark(#e8ecff,#232c52);--hl:light-dark(#ffd84a,#e8c53f);--hl-soft:light-dark(#fff4c2,#3b3417);--coral:light-dark(#f2583a,#ff8a70);--coral-soft:light-dark(#ffe6df,#3d2420);
--ok:light-dark(#127a5a,#5fd3a8);--ok-soft:light-dark(#e1f5ec,#163328);--warn:light-dark(#8a5a00,#f0c068);--warn-soft:light-dark(#fff3dc,#33280f);
--l0:light-dark(#ffffff,#191d27);--l1:light-dark(#fff1b8,#4a3f14);--l2:light-dark(#ffd84a,#b39222);--l3:light-dark(#aebcff,#3b4ca8);--l4:light-dark(#5d76f0,#6b82ff);--l5:light-dark(#2236a8,#b9c6ff);
--r:14px;--sh:0 1px 0 light-dark(#0000000d,#0000),0 6px 24px -12px light-dark(#1c213040,#000a)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:72px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Lexend,system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:clip;
background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;background-attachment:fixed}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--pen)}
h1,h2,h3{line-height:1.1;text-wrap:balance;margin:0 0 .4em}
h1{font-size:clamp(28px,4vw,40px);font-weight:700}h2{font-size:22px;font-weight:600}h3{font-size:17px;font-weight:600}
p{margin:.4em 0 .8em}.muted{color:var(--mute)}.small{font-size:14px}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.top .in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:8px max(4vw,12px);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;margin-right:auto;cursor:pointer;background:none;border:0;padding:6px 0}
.brand i{display:grid;grid-template-columns:repeat(3,8px);gap:2px}.brand i b{width:8px;height:8px;border-radius:2px;background:var(--l4)}.brand i b:nth-child(2n){background:var(--hl)}.brand i b:nth-child(5){background:var(--coral)}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{border:0;background:none;padding:10px 12px;border-radius:10px;cursor:pointer;min-height:44px;color:var(--mute);font-weight:500}
nav button[aria-current=page]{background:var(--pen-soft);color:var(--pen)}
nav button:hover{color:var(--ink)}
main{max-width:1100px;margin:0 auto;padding:20px max(4vw,12px) 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--sh)}
.grid2{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.stack{display:grid;gap:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 18px;border-radius:12px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:600;text-decoration:none}
.btn:hover{border-color:var(--pen)}
.btn.pri{background:var(--pen);border-color:var(--pen);color:var(--pen-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.hl{background:var(--hl);border-color:var(--hl);color:#1c2130}
.btn:disabled{opacity:.45;cursor:default}
.btn.sm{min-height:38px;padding:6px 12px;font-size:14px}
:focus-visible{outline:3px solid var(--hl);outline-offset:2px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:3px 10px;border-radius:999px;background:var(--pen-soft);color:var(--pen);font-weight:500;white-space:nowrap}
.chip.new{background:transparent;border:1px dashed var(--line);color:var(--mute)}
.chip.progress{background:var(--hl-soft);color:var(--warn)}
.chip.review{background:var(--coral-soft);color:var(--coral)}
.chip.almost{background:var(--pen-soft);color:var(--pen)}
.chip.done{background:var(--ok-soft);color:var(--ok)}
.chip.soon{background:transparent;color:var(--mute);border:1px solid var(--line)}
/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px;align-items:stretch}
.next{background:var(--pen);color:var(--pen-ink);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden}
.next .lbl{font-size:14px;opacity:.85}
.next h2{font-size:clamp(22px,3vw,30px);font-weight:700;margin:0}
.next .btn{align-self:flex-start;background:var(--hl);border-color:var(--hl);color:#1c2130;margin-top:auto}
.next::after{content:"";position:absolute;right:-20px;bottom:-20px;width:150px;height:150px;background-image:linear-gradient(#fff3 1px,transparent 1px),linear-gradient(90deg,#fff3 1px,transparent 1px);background-size:15px 15px;transform:rotate(-8deg);pointer-events:none}
.map{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.map .cells{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.map .drow{display:grid;grid-template-columns:120px minmax(0,1fr);gap:8px;align-items:center}
.map .drow span{font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.map .sq{display:flex;flex-wrap:wrap;gap:3px}
.cell{width:18px;height:18px;border-radius:4px;border:1px solid var(--line);background:var(--l0);cursor:pointer;padding:0}
.cell.l1{background:var(--l1)}.cell.l2{background:var(--l2)}.cell.l3{background:var(--l3)}.cell.l4{background:var(--l4)}.cell.l5{background:var(--l5)}
.cell.plan{background:repeating-linear-gradient(45deg,transparent 0 3px,var(--line) 3px 4px);cursor:default}
.cell.rv{outline:2px solid var(--coral);outline-offset:1px}
.resume{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;background:var(--pen);color:var(--pen-ink);border-radius:18px;padding:18px 22px;margin-bottom:16px}
.resume .rtxt{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1 1 420px}.resume .lbl{font-size:14px;opacity:.85}.resume h2{margin:0;font-size:clamp(20px,2.6vw,26px)}
.resume .btn{background:var(--hl);border-color:var(--hl);color:#1c2130;font-size:17px;padding:12px 22px}
.map.big{padding:22px 24px}.map.big h2{font-size:clamp(24px,3vw,32px)}
.map.big .cells{gap:12px;margin-top:14px}.map.big .drow{grid-template-columns:220px minmax(0,1fr);gap:14px}
.map.big .drow .dn{font-size:15px;color:var(--ink);font-weight:600;white-space:normal;overflow:visible;cursor:pointer;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.map.big .drow .dn small{color:var(--mute);font-weight:400;white-space:nowrap;flex:none}
.map.big .sq{gap:6px}.map.big .cell{width:34px;height:34px;border-radius:8px}
.map.big .legend{font-size:13px;margin-top:16px}
.cell{position:relative}
.cell[data-tip]:hover::after,.cell[data-tip]:focus-visible::after{content:attr(data-tip);position:absolute;left:50%;bottom:calc(100% + 8px);transform:translateX(-50%);background:#1c2130;color:#fff;font:500 13px/1.35 Lexend,sans-serif;white-space:pre;padding:7px 10px;border-radius:8px;z-index:30;pointer-events:none;box-shadow:0 4px 14px #0003;text-align:left}
.cell[data-tip]:hover::before,.cell[data-tip]:focus-visible::before{content:"";position:absolute;left:50%;bottom:calc(100% + 2px);transform:translateX(-50%);border:6px solid transparent;border-top-color:#1c2130;z-index:30}
.asps{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0}.asp{font-size:11.5px;padding:2px 7px;border-radius:999px;border:1px solid var(--line);color:var(--mute);background:var(--card);white-space:nowrap}.asp.ok{background:#e3f6ec;border-color:#9fd8b8;color:#17663f}.asp.work{background:#fff4d6;border-color:#f0d58a;color:#7a5a00}
.skcard.locked{opacity:.92;background:repeating-linear-gradient(45deg,var(--card) 0 10px,#f3f4f8 10px 20px);cursor:default}.skcard.stuck{border-color:var(--coral)}
.cell.lk{background:repeating-linear-gradient(45deg,var(--l0) 0 4px,#d9dce6 4px 6px)}.cell.st{outline:2px dashed var(--coral);outline-offset:1px}.cell.tr{outline:2px solid var(--pen);outline-offset:1px}
.legend i.lkl{background:repeating-linear-gradient(45deg,#fff 0 3px,#c9cdd8 3px 5px)}
.resume.alt{background:#fff4d6;color:#1c2130;border:1px solid #f0d58a}.resume.alt .btn{background:var(--pen);border-color:var(--pen);color:#fff}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin-top:10px}.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px;border:1px solid var(--line)}
.stat{display:flex;flex-direction:column;gap:2px}.stat b{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}.stat span{font-size:13px;color:var(--mute)}
.week{display:flex;gap:6px;margin-top:6px}.week i{width:22px;height:22px;border-radius:6px;border:1px solid var(--line);display:grid;place-items:center;font-size:10px;font-style:normal;color:var(--mute)}.week i.on{background:var(--coral);border-color:var(--coral);color:#fff}
.badges{display:flex;gap:8px;flex-wrap:wrap}
.badge{display:flex;align-items:center;gap:8px;padding:6px 10px 6px 6px;border-radius:12px;background:var(--coral-soft);font-size:13px}
.badge .ico{width:28px;height:28px;border-radius:8px;background:var(--coral);display:grid;place-items:center;color:#fff;font-weight:700}
.badge.off{background:transparent;border:1px dashed var(--line);color:var(--mute)}.badge.off .ico{background:var(--line)}
.list{display:grid;gap:8px}
.li{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);cursor:pointer;text-align:left;width:100%}
.li:hover{border-color:var(--pen)}
.li .t{flex:1}.li .t b{display:block;font-weight:600}.li .t small{color:var(--mute);font-size:13px}
.meter{height:8px;border-radius:99px;background:var(--grid);overflow:hidden;min-width:60px}.meter i{display:block;height:100%;background:var(--pen);border-radius:99px;transition:width .6s}
.lvl{display:inline-flex;gap:2px}.lvl i{width:10px;height:10px;border-radius:3px;background:var(--grid);border:1px solid var(--line)}.lvl i.f{background:var(--pen);border-color:var(--pen)}.next .lvl i{background:#ffffff33;border-color:#ffffff55}.next .lvl i.f{background:var(--hl);border-color:var(--hl)}
.dz{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.dzc{padding:16px;border-radius:16px;border:1px solid var(--line);background:var(--card);cursor:pointer;display:flex;flex-direction:column;gap:8px;text-align:left}
.dzc:hover{border-color:var(--pen)}
.dzc .ic{width:42px;height:42px;border-radius:12px;background:var(--pen-soft);color:var(--pen);display:grid;place-items:center;font-weight:700;font-size:20px}
.rec{outline:2px solid var(--hl);outline-offset:2px}
.crumbs{display:flex;gap:6px;flex-wrap:wrap;font-size:14px;margin-bottom:10px}.crumbs button{background:none;border:0;color:var(--pen);cursor:pointer;padding:4px 0}
/* matematyka */
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 .12em;line-height:1.05;font-variant-numeric:tabular-nums}
.fr .nu{border-bottom:2px solid currentColor;padding:0 .15em}.fr .de{padding:0 .15em}
.mx{margin-right:.05em}
.q{font-size:clamp(19px,2.6vw,24px);line-height:1.6}
.q b{font-weight:600}
.vis{display:block;max-width:100%;height:auto;margin:12px auto}
.vis.pie{width:150px}.vis.bar{width:min(320px,100%)}.vis.geo{width:min(320px,100%)}
.vis .sh{fill:var(--hl);stroke:var(--ink);stroke-width:1.5}.vis .un{fill:var(--card);stroke:var(--ink);stroke-width:1.5}
.vis .ln{stroke:var(--ink);stroke-width:2.5;stroke-linecap:round}.vis .arc{fill:none;stroke:var(--coral);stroke-width:2}
.vis .shape{fill:var(--pen-soft);stroke:var(--ink);stroke-width:2}.vis .shape.top{fill:var(--l3)}.vis .shape.side{fill:var(--l4);opacity:.6}
.vis .dash{stroke:var(--coral);stroke-width:2;stroke-dasharray:5 4}.vis .tick{stroke:var(--ink);stroke-width:2}
.vis .lb{font:600 14px Lexend,sans-serif;fill:var(--ink)}.vis .ax{font:12px Lexend,sans-serif;fill:var(--mute)}.vis .grid{stroke:var(--line);stroke-width:1}.vis .barc{fill:var(--pen)}
/* lekcja */
.lesson{max-width:760px;margin:0 auto}
.lhead{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.dots{display:flex;gap:4px;flex-wrap:wrap;flex:1}.dots i{width:16px;height:16px;border-radius:4px;border:1px solid var(--line);background:var(--card)}.dots i.ok{background:var(--pen);border-color:var(--pen);animation:fill .45s ease}.dots i.no{background:var(--hl-soft);border-color:var(--hl)}.dots i.cur{outline:2px solid var(--pen);outline-offset:1px}
@keyframes fill{0%{transform:scale(.4)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.task{padding:22px}
.tag{font-size:13px;color:var(--mute);margin-bottom:6px;display:flex;gap:8px;flex-wrap:wrap}
.answer{margin-top:16px;display:grid;gap:10px}
.inp{width:100%;font-size:22px;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--bg);min-height:56px}
.inp:focus{border-color:var(--pen);outline:none}
.keys[hidden]{display:none}.keys{display:flex;gap:6px;flex-wrap:wrap}.keys button{min-width:48px;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:18px}
.preview{font-size:15px;color:var(--mute);min-height:28px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.opt{min-height:56px;padding:10px 14px;border-radius:12px;border:2px solid var(--line);background:var(--card);cursor:pointer;font-size:19px;text-align:center}
.opt:hover{border-color:var(--pen)}.opt.sel{border-color:var(--pen);background:var(--pen-soft)}.opt.right{border-color:var(--ok);background:var(--ok-soft)}.opt.wrong{border-color:var(--hl);background:var(--hl-soft)}
.opt:disabled{cursor:default}
.steps{counter-reset:s;display:grid;gap:6px;margin:10px 0;padding:0;list-style:none}.steps li{counter-increment:s;padding:8px 12px;border-radius:10px;background:var(--bg);border:1px solid var(--line)}.steps li::before{content:"Krok " counter(s) ": ";font-weight:600;color:var(--mute)}
.ord{display:flex;gap:8px;flex-wrap:wrap}.ord button{min-height:48px;padding:8px 14px;border-radius:12px;border:2px solid var(--line);background:var(--card);cursor:pointer;font-size:18px}
.ord button.used{opacity:.35}
.seq{min-height:56px;border:2px dashed var(--line);border-radius:12px;padding:8px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seq button{min-height:40px;padding:6px 12px;border-radius:10px;border:0;background:var(--pen-soft);color:var(--pen);cursor:pointer;font-size:17px}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:10px;align-items:center}
.mrow select,.multi input{font-size:18px;padding:10px;border-radius:10px;border:2px solid var(--line);background:var(--bg);min-height:48px;width:100%}
.multi{display:grid;gap:10px}.multi label{display:grid;gap:4px;font-size:14px;color:var(--mute)}.multi.tbl{display:flex;flex-wrap:nowrap;gap:0;border:2px solid var(--line);border-radius:14px;overflow:hidden;width:100%;max-width:360px;background:var(--card)}.multi.tbl label{flex:1 1 0;min-width:0}.multi.tbl label{gap:0;text-align:center;font-weight:600;font-size:15px;color:var(--ink);border-right:2px solid var(--line)}.multi.tbl label:last-child{border-right:0}.multi.tbl .th{padding:8px 8px;background:var(--grid);font-size:14px;overflow-wrap:anywhere}.multi.tbl input{width:100%;min-width:0;border:0;border-top:2px solid var(--line);border-radius:0;text-align:center;font-size:26px;font-weight:600;padding:10px}.multi.tbl input:focus{outline:3px solid var(--pen);outline-offset:-3px}
.fb{margin-top:14px;padding:14px 16px;border-radius:12px;font-size:16px}
.fb.ok{background:var(--ok-soft);border:1px solid var(--ok)}.fb.no{background:var(--hl-soft);border:1px solid var(--hl)}.fb.info{background:var(--pen-soft);border:1px solid var(--pen)}
.fb h3{margin:0 0 4px}
.hints{margin-top:12px;display:grid;gap:8px}.hint{padding:10px 14px;border-left:4px solid var(--hl);background:var(--hl-soft);border-radius:0 10px 10px 0}
.sol{padding:12px 16px;border-radius:10px;background:var(--bg);border:1px solid var(--line)}.sol ol{margin:4px 0;padding-left:22px}
.bar2{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.bigcard{padding:24px;border-radius:18px;background:var(--card);border:1px solid var(--line);box-shadow:var(--sh)}
.bigcard.remed{border-left:6px solid var(--hl)}
.ex{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0;background:var(--bg)}
.ex ol{margin:6px 0;padding-left:22px}
.ex li.hid{display:none}
.mist li{margin:4px 0}
textarea{width:100%;min-height:90px;border-radius:10px;border:1px solid var(--line);background:var(--bg);padding:10px;font-size:16px}
details{border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--card)}details summary{cursor:pointer;font-weight:600;min-height:32px}
table{width:100%;border-collapse:collapse;font-size:15px}th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}th{font-weight:600;color:var(--mute);font-size:13px}td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.scroll{overflow-x:auto}
.hbar{display:grid;grid-template-columns:minmax(0,180px) minmax(0,1fr) 44px;gap:8px;align-items:center;font-size:14px;margin:6px 0}.hbar .meter{height:12px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;z-index:50;display:flex;gap:10px;align-items:center;box-shadow:var(--sh);animation:up .4s ease}
@keyframes up{from{transform:translate(-50%,20px);opacity:0}}
.timer{font-variant-numeric:tabular-nums;font-weight:700;padding:6px 12px;border-radius:10px;background:var(--pen-soft);color:var(--pen)}
.timer.low{background:var(--coral-soft);color:var(--coral)}
.qnav{display:flex;gap:6px;flex-wrap:wrap}.qnav button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer}.qnav button.a{background:var(--pen-soft);border-color:var(--pen)}.qnav button.c{outline:2px solid var(--pen)}
.me{border:0;background:none;padding:2px;border-radius:50%;cursor:pointer;min-width:44px;min-height:44px;display:grid;place-items:center}.me svg{border-radius:50%;display:block}.me[hidden]{display:none}
.hello{display:flex;align-items:center;gap:14px;margin-bottom:14px}.hello svg{border-radius:50%;flex:none}.hello h1{margin:0}
.ints{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}

nav .navout:hover{background:var(--coral-soft)}
.map.big .drow .dn{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:8px;padding:8px 10px;margin:-8px 0;border-radius:10px;cursor:pointer;font-size:15px;font-weight:600;color:var(--pen)}
.map.big .drow .dn .dnt{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px;text-decoration-color:color-mix(in srgb,var(--pen) 40%,transparent)}
.map.big .drow .dn .arr{font-size:20px;line-height:1;margin-left:auto}
.map.big .drow .dn small{color:var(--mute);font-weight:400}
.map.big .drow .dn:hover{background:var(--pen-soft)}.map.big .drow .dn:hover .dnt{text-decoration-color:var(--pen)}
.map.big .drow .dn:focus-visible{outline:3px solid var(--pen);outline-offset:2px}
.dzhint{display:flex;gap:8px;align-items:center;background:var(--hl-soft);border-radius:12px;padding:8px 12px;font-size:14px;margin:8px 0 6px}
.kidgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.kidc{position:relative;display:flex;flex-direction:column;gap:10px;padding:18px}
.kstats{display:flex;gap:18px;font-size:14px;color:var(--mute)}.kstats b{display:block;color:var(--ink);font-size:17px}
.ktags{display:flex;gap:6px;flex-wrap:wrap}.ktag{font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px}
.ktag.w{background:var(--warn-soft);color:var(--warn)}.ktag.a{background:var(--pen-soft);color:var(--pen)}.ktag.r{background:var(--coral-soft);color:light-dark(#a8381f,#ff8a70)}.ktag.g{background:var(--ok-soft);color:var(--ok)}
.kmenu{position:absolute;right:10px;top:10px;border:0!important;padding:0!important;background:none!important}.kmenu summary{list-style:none;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;cursor:pointer;font-size:20px;color:var(--mute)}.kmenu summary::-webkit-details-marker{display:none}
.kmenu summary:hover,.kmenu[open] summary{background:var(--pen-soft)}
.kmenu-in{position:absolute;right:0;top:42px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px -12px rgba(30,40,80,.35);min-width:220px;padding:6px;z-index:5}
.kmenu-in button{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 10px;border-radius:8px;cursor:pointer;font:inherit}
.kmenu-in button:hover{background:var(--pen-soft)}.kmenu-in .danger{color:light-dark(#b3361d,#ff8a70)}
.kidadd{border:2px dashed var(--line);border-radius:18px;background:transparent;display:grid;place-items:center;align-content:center;gap:4px;min-height:200px;cursor:pointer;color:var(--pen);font:inherit;padding:18px;text-align:center}
.kidadd:hover{border-color:var(--pen);background:var(--pen-soft)}.kidadd .plus{font-size:30px;line-height:1}
.kswitch{display:flex;gap:8px;flex-wrap:wrap}.kswitch button{display:flex;align-items:center;gap:8px;border:2px solid var(--line);background:var(--card);border-radius:999px;padding:3px 14px 3px 3px;cursor:pointer;font:inherit;font-weight:600}
.kswitch button[aria-pressed=true]{border-color:var(--pen);background:var(--pen-soft)}
.aback2{border:0;background:none;color:var(--mute);cursor:pointer;padding:6px 0;font:inherit}
.psett{display:grid;grid-template-columns:230px minmax(0,1fr);gap:20px;align-items:start}.psett>*{min-width:0}
.sside{position:sticky;top:80px;display:grid;gap:4px}
.sside button{display:flex;align-items:center;gap:10px;border:0;background:none;padding:9px 12px;border-radius:12px;cursor:pointer;text-align:left;font:inherit;font-weight:600}
.sside button:hover{background:var(--pen-soft)}.sside button[aria-current=page]{background:var(--pen-soft);color:var(--pen)}.sside .sadd{color:var(--pen)}
.sside .slbl{font-size:12px;color:var(--mute);margin:10px 12px 2px;font-weight:600}
.sset{margin-bottom:16px}.sset h2{margin-top:0}
.srow{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);flex-wrap:wrap}.srow:first-of-type{border-top:0}
.srow .st{flex:1;min-width:200px}.srow .st small{display:block;color:var(--mute);font-size:13px}
.dzone{border-color:#f0c4b8}.dzone h2{color:light-dark(#b3361d,#ff8a70)}
.btn.danger{color:light-dark(#b3361d,#ff8a70);border-color:#f0c4b8}
@media (max-width:760px){.psett{grid-template-columns:minmax(0,1fr)}.sside{position:static;display:flex;flex-wrap:wrap;gap:6px}.sside .slbl{display:none}.sside button{border:1px solid var(--line)}.map.big .drow .dn{margin:0}}
.map.big .drow .dn span.dnt{font-size:15px;color:var(--pen);white-space:normal;overflow:visible;text-overflow:clip;font-weight:600}
.map.big .drow .dn span.arr{font-size:20px;color:var(--pen);overflow:visible}
.map.big .drow .dn small{font-size:13px}
.kmenu>summary{border:0!important;padding:0!important;background:none;margin:0!important;font-weight:400}
.kidc>.row{padding-right:40px}
.ptable{display:grid;gap:4px}
.prow{display:grid;grid-template-columns:minmax(140px,1.4fr) minmax(90px,1fr) 120px 150px 130px;gap:10px;align-items:center;padding:6px 0;font-size:14px}
.prow .pn{font-weight:600}.prow.sub{padding-left:16px;font-size:13px}.prow.sub .pn{font-weight:400}
.pdz{border:0!important;padding:0!important;background:none!important;border-top:1px solid var(--line)!important;border-radius:0!important}.pdz>summary{list-style:none;min-height:0}.pdz>summary::-webkit-details-marker{display:none}
.pdz>summary .pn::before{content:'▸ ';color:var(--mute)}.pdz[open]>summary .pn::before{content:'▾ '}
.pbar{position:relative;height:10px;border-radius:6px;background:#eef0f6;display:block}.pbar i{display:block;height:100%;border-radius:6px}.pbar i.n{background:var(--pen)}.pbar i.s{background:var(--coral)}.pbar i.f{background:var(--ok)}
.pbar b{position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
.pbadge{font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;justify-self:start}.pbadge.s{background:var(--coral-soft);color:light-dark(#a8381f,#ff8a70)}.pbadge.n{background:var(--pen-soft);color:var(--pen)}.pbadge.f{background:var(--ok-soft);color:var(--ok)}.pbadge.q{background:#eef0f6;color:var(--mute)}
.pv{white-space:nowrap}.pok{color:var(--mute);font-size:13px}
@media (max-width:760px){.prow{grid-template-columns:1fr auto;gap:4px 10px}.prow .pbar{grid-column:1/-1}.prow .pok{grid-column:1}.prow .pbadge{justify-self:end}}
.hpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.int.hp{padding:10px 6px}.int.hp svg{display:block;margin:0 auto 4px}
.hfb{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start;margin-top:14px}
.hfig{display:grid;justify-items:center;gap:2px}.hname{font-size:12px;font-weight:700;color:var(--mute)}
.hbub{position:relative;min-width:0}.hbub>.fb,.hbub>.hints{margin-top:0}
.hbub::before{content:'';position:absolute;left:-9px;top:26px;width:16px;height:16px;transform:rotate(45deg);background:var(--card);border-left:1px solid var(--line);border-bottom:1px solid var(--line);z-index:0}
.hfb-happy .hbub::before,.hfb-party .hbub::before{background:var(--ok-soft);border-color:var(--ok)}
.hfb-oops .hbub::before{background:var(--hl-soft);border-color:var(--hl)}
.hfb-think .hbub::before{background:var(--pen-soft);border-color:var(--pen)}
.hfb.sm.hfb-think .hbub::before{background:#fff8d6;border-color:#f4d77a}
.hbub>*{position:relative;z-index:1}
.hsound{display:inline-block;font-weight:700;font-size:13px;color:var(--ok);margin:0 0 4px 2px}
.hfb .helper{filter:drop-shadow(0 2px 3px rgba(0,0,0,.12))}
.hfb-happy .helper,.hfb-party .helper{animation:hbounce .5s ease-out}
.hfb-oops .helper{animation:hshake .5s ease-in-out}
@keyframes hbounce{0%{transform:translateY(6px) scale(.92)}60%{transform:translateY(-4px) scale(1.04)}100%{transform:none}}
@keyframes hshake{0%,100%{transform:none}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
@media (prefers-reduced-motion:reduce){.hfb .helper{animation:none!important}}
@media (max-width:600px){.hfb{grid-template-columns:56px minmax(0,1fr);gap:8px}.hfb .helper{width:56px;height:56px}.hbub::before{top:18px}}
@media (max-width:420px){header.top nav button{padding:7px 7px;font-size:13px;white-space:nowrap}header.top .in{gap:6px}}
.anslist{padding-left:22px;display:grid;gap:10px;margin:8px 0 6px}.anslist li{padding:10px 12px;border-radius:12px;background:var(--grid)}.anslist .aq{font-size:16px}.anslist .aa{font-size:15px;margin-top:4px;color:var(--mute)}.anslist .aa b{color:var(--ink)}.anslist .tick{color:var(--ok);font-weight:700}
.newbadge{display:inline-flex;gap:8px;align-items:center;padding:8px 14px;border-radius:12px;background:var(--hl-soft)}.newbadge .ico{color:var(--hl)}
details.more summary{cursor:pointer;color:var(--pen);font-size:14px;margin:-4px 0 6px}
.btn.speak{margin-left:auto;padding:4px 10px;min-height:32px}
.week2{display:flex;gap:4px;margin:6px 0}.week2 i{font-style:normal;font-size:12px;min-width:28px;height:28px;display:grid;place-items:center;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--mute)}.week2 i.on{background:var(--pen-soft);color:var(--pen);border-color:var(--pen-soft);font-weight:700}.week2 i.today{outline:2px solid var(--ink);outline-offset:1px}.week2 i.fut{opacity:.45}
.nextstep{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:16px 18px;border-radius:16px;background:var(--pen);color:var(--pen-ink);margin-bottom:16px}.nextstep .lbl{font-size:13px;opacity:.85}.nextstep h2{margin:2px 0 0;color:inherit}.nextstep .btn{background:var(--hl);color:#1d1d1d;border-color:transparent}
.map.big .drow .dn .dnw{display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-width:0;overflow:visible;white-space:normal;font-size:inherit;color:inherit}.map.big .drow .dn .dzbadge{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap;overflow:visible;text-decoration:none}.map.big .drow .dn .dzbadge.ok{background:var(--ok-soft);color:var(--ok)}.map.big .drow .dn .dzbadge.rd{background:var(--warn-soft);color:var(--warn)}
.lvlhelp{margin-top:10px}.lvlhelp summary{cursor:pointer;color:var(--pen);font-weight:600}.lvlhelp dl{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:10px 0}.lvlhelp dt{font-weight:700}.lvlhelp dd{margin:0}

/* minigry */
.goffer{margin:14px 0;padding:14px;border-radius:var(--r);background:var(--hl-soft);border:1px solid var(--hl)}.goffer p{margin:0 0 6px}
.game .ghead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}.game .ghead b{font-size:20px}
.ggoal{font-size:20px}.ggoal .gfr,.gitem .gfr{display:inline-flex;flex-direction:column;align-items:center;line-height:1.05;vertical-align:middle}.gfr i{font-style:normal}.gfr i:first-child{border-bottom:2px solid currentColor;padding:0 3px}
.gbar{display:flex;align-items:center;gap:10px;font-weight:700}.gsc{min-width:36px;font-size:22px;color:var(--ok)}.gtgt{flex:1;color:var(--mute);font-weight:600}.gtime{width:90px;height:10px;border-radius:6px;background:var(--line);overflow:hidden}.gtime i{display:block;height:100%;width:100%;background:var(--pen)}
.garea{position:relative;height:min(380px,58vh);margin-top:8px;border-radius:var(--r);border:1px solid var(--line);overflow:hidden;touch-action:manipulation;background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;user-select:none;-webkit-user-select:none}
.gitem{position:absolute;top:0;min-width:64px;min-height:52px;padding:6px 12px;border-radius:14px;border:2px solid var(--pen);background:var(--card);color:var(--ink);font:700 22px/1.1 inherit;font-family:inherit;cursor:pointer;will-change:transform;touch-action:manipulation}
.gitem.gok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}.gitem.gno{background:var(--warn-soft);border-color:var(--warn);opacity:.7}.gitem small{font-size:14px}
.gwhy{min-height:1.4em;margin:8px 0 0;color:var(--mute)}.gbig{font-size:26px;margin:6px 0}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
@media(pointer:coarse){.btn.sm{min-height:44px}.map.big .cell{width:44px;height:44px}.map.big .sq{gap:6px}}
</style>
